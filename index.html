<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumenfall</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;color:#EFE6D8;position:relative;overflow-x:hidden;
 background:radial-gradient(120% 90% at 50% 8%,#2C241C 0%,#1A150F 45%,#0E0B08 100%);
 font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
 display:flex;flex-direction:column;align-items:center;
 user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:background 1.4s}
body.lit{background:radial-gradient(120% 90% at 50% 8%,#241B12 0%,#130E09 45%,#080605 100%)}
.wrap{width:100%;max-width:440px;padding:14px 16px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
header{width:100%;display:flex;justify-content:space-between;align-items:flex-start}
.title{font-size:13px;font-weight:700;letter-spacing:3.5px;color:#C9B89E}
.subrow{display:flex;align-items:center;gap:6px;margin-top:4px}
#sub{font-size:12px;font-weight:600;color:#E6D5B8;min-width:78px;text-shadow:0 1px 2px #0007;cursor:pointer}
.subrow button,.hb button{border:0;background:none;color:#5E5343;font:inherit;font-weight:700;cursor:pointer}
.subrow button{font-size:15px;line-height:1;padding:0 2px}
.hb{display:flex;gap:12px;flex:0 0 auto}.hb button{white-space:nowrap;padding:2px 0;font-size:13px;color:#E6D5B8;text-shadow:0 1px 2px #0007}
.goalrow{display:flex;align-items:center;gap:14px;align-self:flex-start;width:100%}
#goal{flex:0 0 auto;opacity:.95;cursor:zoom-in}
/* 고양이는 창 아래 창턱 오른쪽 끝에 앉는다. 공중에 떠 보이지 않게. 누름은 아래로 통과시킨다. */
.goalrow{position:relative}
.cat{position:absolute;right:0;bottom:2px;height:112px;width:auto;z-index:5;pointer-events:none;
 filter:drop-shadow(0 6px 10px #0007);transform-origin:50% 100%}
.cat.hop{animation:cathop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes cathop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.04,.97)}100%{transform:translateY(0) scale(1)}}
.goallab{font-size:14px;font-weight:600;color:#F6E8D0;line-height:1.55;text-shadow:0 1px 3px #0008}
.boardwrap{width:min(92vw,390px,50vh);transition:filter 1.4s}
#board{width:100%;display:block;touch-action:none;filter:drop-shadow(0 14px 30px #00000088)}
body.lit .boardwrap{filter:drop-shadow(0 0 46px #F5CE8A4a) drop-shadow(0 0 120px #F5CE8A22)}
.paints{display:flex;gap:18px;justify-content:center;align-items:flex-end;min-height:74px;transition:opacity 1.4s}
.pw{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px}
.p{border:0;cursor:pointer;position:relative;padding:0;background:center/contain no-repeat;
 transition:transform .16s cubic-bezier(.34,1.4,.64,1);filter:drop-shadow(0 4px 6px #0008)}
.p.on{transform:translateY(-9px) scale(1.1);filter:drop-shadow(0 0 10px #FFE7B066) drop-shadow(0 6px 8px #0008)}
/* 빛 방울: 밝고 옅게, 머리 위에 빛 무늬 */
.p.light{filter:brightness(1.45) saturate(.55) drop-shadow(0 0 8px #FFF6D8aa)}
.p.light::before{content:"✦";position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:14px;color:#FFF3C8;text-shadow:0 0 6px #FFE9A0}
.p:disabled{opacity:.55;cursor:default;filter:grayscale(.35) drop-shadow(0 3px 5px #0007)}
.rng{font-size:11px;font-weight:700;color:#E6D5B8;text-shadow:0 1px 2px #0007}
.cnt{position:absolute;top:-3px;right:-3px;width:19px;height:19px;border-radius:50%;
 background:#171209;color:#EFDFC0;font-size:10.5px;font-weight:800;line-height:19px;text-align:center;pointer-events:none}
.tools{display:flex;gap:24px;justify-content:center}
.tools button{border:0;background:none;color:#E6D5B8;text-shadow:0 1px 2px #0007;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;padding:3px}
.msg{font-size:14px;font-weight:700;text-align:center;min-height:34px;color:#C9B89E}
body.lit .msg{color:#F3DFB6}
.msg small{display:block;font-size:13px;font-weight:600;color:#E6D5B8;margin-top:5px}
.next{display:none;margin-top:4px;
 border:1.5px solid #B99A64;background:#1A130Ce8;
 color:#F3DFB6;font:inherit;font-weight:700;font-size:15px;padding:14px 44px;border-radius:2px;
 cursor:pointer;letter-spacing:2px}
/* 완성하면 물감 줄과 되돌리기를 접고, 별 · 다음 창 버튼을 그 자리에 차례로 놓는다 */
.next.show{display:block;animation:nextin .45s ease-out both}
@keyframes nextin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
body.lit .paints,body.lit .tools{display:none}
.hb button{position:relative}
.badge{display:inline-block;margin-left:5px;min-width:16px;height:16px;line-height:16px;padding:0 4px;
 border-radius:8px;background:#3A2E1E;color:#D6C09A;font-size:10px;font-weight:800;vertical-align:1px}
.sheet{position:fixed;inset:0;background:#0B0806;z-index:40;display:flex;flex-direction:column;
 padding:18px 16px 26px;gap:16px;transform:translateY(100%);
 transition:transform .38s cubic-bezier(.4,0,.2,1);pointer-events:none}
.sheet.open{transform:translateY(0);pointer-events:auto}
.sheetbar{display:flex;justify-content:space-between;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.sheettitle{font-size:13px;font-weight:700;letter-spacing:3px;color:#C9B89E}
.sheettitle span{margin-left:8px;letter-spacing:0;font-size:11px;color:#7E7060}
.sheetbar button{border:0;background:none;color:#7E7060;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.gallery{display:flex;flex-direction:column;gap:22px;overflow-y:auto;flex:1;padding:4px 2px 24px}
/* 묶음 하나가 벽 한 면. 창은 끈에 매달린 나무 액자에 건다 */
.gset h3{margin:0 0 10px;font-weight:400;font-size:15px;color:#E6D5B8;letter-spacing:1px;display:flex;align-items:baseline;gap:8px}
.gset h3 span{font-size:11px;color:#8E7F6A;letter-spacing:0}
.gset.full h3 span{color:#F5CE8A}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;padding:14px 10px 12px;border-radius:4px;
 background:linear-gradient(180deg,#2A2119,#1C1611);box-shadow:inset 0 2px 10px #0008}
.gset.full .wall{box-shadow:inset 0 2px 10px #0008,0 0 0 1px #F5CE8A55,0 0 24px #F5CE8A22}
.gitem{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.gitem::before{content:"";position:absolute;top:-12px;left:50%;width:34%;height:14px;transform:translateX(-50%);
 border:1px solid #8E7A5A;border-bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:none}
.frame{width:100%;padding:5px;border-radius:3px;background:linear-gradient(145deg,#7A5B3C,#4A3421);box-shadow:0 5px 12px #0009,inset 0 0 0 1px #9C7A52}
.frame canvas{display:block;width:100%;height:auto;border-radius:1px;background:#0F0B07}
.gitem.todo .frame{background:linear-gradient(145deg,#3A2E23,#2A2119);box-shadow:inset 0 0 0 1px #4A3B2C}
.gitem.todo canvas{opacity:.55}
.gitem span{font-size:11px;color:#C9B89E;text-align:center;line-height:1.35}
.gitem span b{display:block;font-weight:400;color:#F5CE8A;letter-spacing:1px;font-size:10px}
.gitem span i{font-style:normal;font-size:10px;color:#8E7F6A;margin-left:3px}
.gitem.todo span{color:#6B5F4E}
.empty{color:#6B5F4E;font-size:12.5px;font-weight:600;line-height:1.7;text-align:center;margin:auto}
.empty.hide{display:none}
.title,.msg,#sub,.rng,.cnt,.goallab,.hb button,.tools button,.next,.sheettitle,.badge{font-weight:400!important}
.title{letter-spacing:2.5px;font-size:15px;min-width:0}
@media (max-width:350px){.hb{gap:9px}.hb button{font-size:12px}.title{letter-spacing:1.5px}}
.msg{font-size:17px}
body[data-time="dawn"]{background:radial-gradient(120% 90% at 50% 6%,#9A6A7C 0%,#5C3E4C 42%,#2A1C24 100%)}
body[data-time="noon"]{background:radial-gradient(120% 90% at 50% 6%,#A8844C 0%,#5E4826 42%,#2A2012 100%)}
body[data-time="dusk"]{background:radial-gradient(120% 90% at 50% 6%,#B0664A 0%,#653421 42%,#2A140C 100%)}
body[data-time="night"]{background:radial-gradient(120% 90% at 50% 6%,#3B4F80 0%,#1C2748 42%,#0A0F1E 100%)}
body.lit[data-time="dawn"]{background:radial-gradient(120% 90% at 50% 6%,#6E4A58 0%,#3A2530 45%,#170E13 100%)}
body.lit[data-time="noon"]{background:radial-gradient(120% 90% at 50% 6%,#7A5E34 0%,#3C2E18 45%,#17110A 100%)}
body.lit[data-time="dusk"]{background:radial-gradient(120% 90% at 50% 6%,#7E4632 0%,#3E2014 45%,#170B06 100%)}
body.lit[data-time="night"]{background:radial-gradient(120% 90% at 50% 6%,#2A3960 0%,#121A34 45%,#060913 100%)}
.par{display:block;margin-top:6px;font-size:12px;color:#E6D5B8;opacity:.8}
.par .nw{white-space:nowrap}
.peekhint{display:block;margin-top:3px;font-size:11px;color:#E6D5B8;opacity:.6}
.par b{color:#F5CE8A;font-weight:400;letter-spacing:1px;margin-right:3px}
.par .best{margin-left:8px;color:#F5CE8A;letter-spacing:1px}
.stars{font-size:30px;letter-spacing:6px;line-height:1.1;color:#F5CE8A;text-shadow:0 0 14px #F5CE8A66}
.stars .st{display:inline-block;opacity:0;animation:starin .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes starin{0%{opacity:0;transform:scale(.2) rotate(-40deg)}100%{opacity:1;transform:scale(1)}}
.msg .ok{color:#F3DFB6}.msg .no{color:#E6D5B8;opacity:.5;text-decoration:line-through}
.timechip{display:inline-block;margin-left:8px;font-size:11px;color:#F3E2C4;opacity:.75;letter-spacing:0}
@keyframes boardpop{0%{transform:scale(1)}35%{transform:scale(1.045)}65%{transform:scale(.99)}100%{transform:scale(1)}}
.boardwrap.pop{animation:boardpop .7s cubic-bezier(.3,1.4,.5,1)}
/* 창턱: 창 바로 아래 나무 턱. 별로 얻은 장식을 올려 둔다(누름은 통과) */
.sill{position:relative;width:min(96vw,410px);height:50px;margin-top:-14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;
 padding:0 8px;pointer-events:none;z-index:2}
/* 고른 방울이 위로 떠도 창턱 위로 올라오게 */
.paints{position:relative;z-index:3}
.sill::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:9px;border-radius:2px;
 background:linear-gradient(180deg,#8A6440,#5A3E26);box-shadow:0 4px 8px #0008,inset 0 1px 0 #B08658;z-index:-1}
.sill .side{display:flex;gap:4px;align-items:flex-end}
.sill svg{width:46px;height:46px;display:block;filter:drop-shadow(0 2px 2px #0007)}
.sill .d{animation:decoin .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes decoin{from{opacity:0;transform:translateY(-14px) scale(.6)}to{opacity:1;transform:none}}
.dflame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.94,1.06)}60%{transform:scale(1.04,.95)}}
.dglow{animation:glowp 2.4s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.75}50%{opacity:1}}
.dsteam{animation:steam 2.8s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-4px)}}
.dtw{transform-box:fill-box;transform-origin:50% 50%;animation:twk 2s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.7}}
.dfish{animation:swim 3.2s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
.dbub{animation:bub 2.6s linear infinite}
@keyframes bub{0%{opacity:0;transform:translateY(6px)}30%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
/* 창고 위 창턱 꾸미기 */
.decos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;padding:12px 10px;border-radius:4px;
 background:linear-gradient(180deg,#2A2119,#1C1611);box-shadow:inset 0 2px 10px #0008}
.dk{border:0;background:none;font:inherit;color:#C9B89E;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
 border-radius:6px;cursor:pointer;position:relative}
.dk svg{width:52px;height:52px}
.dk span{font-size:10.5px;line-height:1.2;text-align:center}
.dk.on{background:#F5CE8A1f;box-shadow:inset 0 0 0 1.5px #F5CE8A99}
.dk.on::after{content:"창턱에";position:absolute;top:2px;right:2px;font-size:9px;color:#1A130C;background:#F5CE8A;border-radius:6px;padding:0 4px}
.dk.lock{cursor:default}.dk.lock svg{filter:brightness(0) opacity(.35)}
.dk.lock span{color:#6B5F4E}
.dnote{font-size:11px;color:#8E7F6A;margin:6px 2px 0;line-height:1.5}
/* 단계 고르기 */
.lvlist{overflow-y:auto;flex:1;padding:2px 2px 24px;display:flex;flex-direction:column;gap:18px}
.lvset h3{margin:0 0 8px;font-weight:400;font-size:14px;color:#E6D5B8;letter-spacing:1px}
.lvset h3 span{font-size:11px;color:#8E7F6A;margin-left:6px;letter-spacing:0}
.lvgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lv{border:0;font:inherit;cursor:pointer;background:#1F1812;border-radius:6px;padding:5px 3px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
 box-shadow:inset 0 0 0 1px #3A2E23;color:#E6D5B8;position:relative}
.lv canvas{width:100%;height:auto;display:block}
.lv em{font-style:normal;font-size:12px}
.lv b{font-weight:400;font-size:9.5px;letter-spacing:.5px;color:#F5CE8A;min-height:12px}
.lv.cur{box-shadow:inset 0 0 0 1.5px #F5CE8A}
.lv.new b{color:#9FD39A}
.lv.lock{cursor:default;opacity:.35}
.lv i{position:absolute;top:3px;left:3px;font-style:normal;font-size:8.5px;background:#3D77C2;color:#fff;border-radius:5px;padding:0 3px}
.msg .newdeco{color:#F5CE8A;animation:nextin .5s ease-out 1.8s both}
.dsnow{animation:snow 3s linear infinite}
@keyframes snow{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.dspin{transform-box:view-box;transform-origin:32px 26px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dbob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(1.5px) rotate(-2deg)}}
.dpuff{animation:puff 2.4s ease-out infinite}
@keyframes puff{0%{transform:translate(4px,8px) scale(.5);opacity:0}30%{opacity:.8}100%{transform:translate(-2px,-4px) scale(1.2);opacity:0}}
/* 마을 지도: 묶음마다 건물 하나 */
.village{display:block;width:100%;height:auto;border-radius:4px;box-shadow:inset 0 2px 10px #0008}
.vb{transition:filter .6s}
.vb.off{filter:saturate(.3) brightness(.45)}
.von{filter:url(#vglow)}
.vb.full .vbeam{animation:beam 3.2s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.12}50%{opacity:.42}}
.vstar{animation:twk 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.vb.full .vflag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.6s ease-in-out infinite}
@keyframes flag{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.8)}}
.vlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:10px}
.vlist div{font-size:11px;color:#8E7F6A;display:flex;flex-direction:column;gap:3px}
.vlist div.full{color:#F5CE8A}
.vlist small{font-size:9.5px;color:#6B5F4E}
.vlist i{display:block;height:4px;border-radius:2px;background:#2E251C;overflow:hidden}
.vlist i b{display:block;height:100%;background:linear-gradient(90deg,#C9923E,#F5CE8A)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.stars .st{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">LUMENFALL
      <span class="subrow"><button id="prevLv">‹</button><span id="sub">장미창</span><button id="nextLv">›</button></span>
    </div>
    <div class="hb"><button id="lvBtn">단계</button><button id="galBtn">창고<span class="badge" id="galN">0</span></button><button id="soundBtn">소리</button><button id="resetBtn">다시</button></div>
  </header>
  <div class="goalrow">
    <canvas id="goal" width="260" height="260" style="width:96px;height:96px"></canvas>
    <div class="goallab">이 창이 되도록<br>물감을 떨어뜨리세요<span class="par" id="par"></span><span class="peekhint">그림을 누르면 크게 보여요</span></div>
  </div>
  <div class="boardwrap"><canvas id="board" width="1000" height="1000"></canvas></div>
  <div class="sill"><div class="side" id="sill"></div><img class="cat" id="cat" alt="" src=""></div>
  <div class="paints" id="paints"></div>
  <div class="tools"><button id="undoBtn">되돌리기</button></div>
  <div class="msg" id="msg"></div>
  <button class="next" id="nextBtn">다음 창</button>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheetbar">
    <div class="sheettitle">모은 창<span id="sheetCount"></span></div>
    <button id="closeGal">닫기</button>
  </div>
  <div class="gallery" id="gallery"></div>
  <div class="empty" id="galEmpty">아직 완성한 창이 없습니다.<br>창을 완성하면 여기에 걸립니다.</div>
</div>
<div class="sheet" id="lvSheet" aria-hidden="true">
  <div class="sheetbar">
    <div class="sheettitle">단계<span id="lvCount"></span></div>
    <button id="closeLv">닫기</button>
  </div>
  <div class="lvlist" id="lvList"></div>
</div>
<script src="assets.js"></script>
<script src="deco.js"></script>
<script src="village.js"></script>
<script src="geo.js"></script>
<script src="pictures.js"></script>
<script src="game.js"></script>
</body>
</html>
